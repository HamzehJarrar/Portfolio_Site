services:
  portfolio:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    image: hamzeh-portfolio:latest
    container_name: portfolio
    ports:
      - "80:80"
    restart: unless-stopped
    environment:
      - NODE_ENV=production
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
